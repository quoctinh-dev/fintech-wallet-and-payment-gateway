server:
  port: ${PORT:8082}

spring:
  application:
    name: wallet-account

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15433}/${DB_NAME:wallet_account_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:19052004}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

grpc:
  server:
    port: ${GRPC_PORT:9092}
  client:
    wallet-ledger:
      address: 'discovery:///wallet-ledger'
      negotiation-type: plaintext

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

system:
  user-id: ${SYSTEM_USER_ID:00000000-0000-0000-0000-000000000000}
  default-currency: ${SYSTEM_DEFAULT_CURRENCY:VND}
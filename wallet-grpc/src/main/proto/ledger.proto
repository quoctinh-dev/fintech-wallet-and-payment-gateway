syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.fintech.wallet.grpc.ledger";
option java_outer_classname = "LedgerProto";

service LedgerGrpcService {
  rpc GetAccountBalance (GetBalanceRequest) returns (BalanceResponse);
  rpc RecordEntry (RecordEntryRequest) returns (RecordEntryResponse);
  rpc GetAccountTransactions (GetAccountTransactionsRequest) returns (GetAccountTransactionsResponse);
}

message GetBalanceRequest {
  string account_id = 1;
}

message BalanceResponse {
  double balance = 1;
}

message RecordEntryRequest {
  string transaction_id = 1;
  string account_id = 2;
  double amount = 3;
}

message RecordEntryResponse {
  bool success = 1;
}


message GetAccountTransactionsRequest {
  string account_id = 1;
  int32 page = 2;
  int32 size = 3;
}

message LedgerEntryMessage {
  string transaction_id = 1;
  double amount = 2;
  string created_at = 3;
}

message GetAccountTransactionsResponse {
  repeated LedgerEntryMessage entries = 1;
  int64 total_elements = 2;
  int32 total_pages = 3;
}



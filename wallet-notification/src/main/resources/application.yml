server:
  port: 8085

spring:
  application:
    name: wallet-notification
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15433}/${DB_NAME:wallet_notification_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:19052004}
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
      group-id: notification-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

# Cấu hình Brevo (Lấy từ biến môi trường, bảo vệ Secret Key)
brevo:
  api-key: ${BREVO_API_KEY:your_brevo_api_key_here}
  sender-email: ${BREVO_SENDER_EMAIL:quoctinhstudy1911@gmail.com}
  sender-name: ${BREVO_SENDER_NAME:Fintech Wallet System}

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health